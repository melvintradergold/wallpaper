<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wallpaper ARIFRIPAI_</title>
<style>
    body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: radial-gradient(circle at center, #1a0000 0%, #000000 80%);
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden;
    }
    
    .wallpaper-container {
        text-align: center;
    }

    .name {
        font-size: 6rem;
        font-weight: 900;
        color: #fff;
        letter-spacing: 8px;
        text-transform: uppercase;
        position: relative;
        text-shadow: 
            0 0 10px #ff0000, 
            0 0 20px #ff0000, 
            0 0 40px #cc0000, 
            0 0 80px #8b0000;
        animation: pulse 2s infinite alternate;
    }

    @keyframes pulse {
        0% { text-shadow: 0 0 10px #ff0000, 0 0 20px #ff0000, 0 0 40px #cc0000, 0 0 80px #8b0000; }
        100% { text-shadow: 0 0 15px #ff1a1a, 0 0 30px #ff1a1a, 0 0 50px #e60000, 0 0 100px #b30000; }
    }
</style>
</head>
<body>
    <div class="wallpaper-container">
        <div class="name">ARIFRIPAI_</div>
    </div>
</body>
</html>
